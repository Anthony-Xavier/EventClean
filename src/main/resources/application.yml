spring:

  application:
    name: EventClean

  datasource:
    url: jdbc:postgresql://localhost:5431/EventClean
    username: anthony
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations:classpath: db/migration

server:
  port: 8080
